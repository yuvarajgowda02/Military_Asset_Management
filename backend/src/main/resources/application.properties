spring.application.name=military-asset-management

# ---------- Datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/military_asset_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Kept open so lazy (@ManyToOne) associations on entities returned directly
# from controllers (base, equipmentType, createdBy, etc.) can still be
# serialized to JSON without a LazyInitializationException. For a larger
# production build these endpoints should return dedicated response DTOs
# instead of JPA entities and this can then be set back to false.
spring.jpa.open-in-view=true

# ---------- Server ----------
server.port=8080
server.servlet.context-path=/api

# ---------- JWT ----------
app.jwt.secret=MilitaryAssetManagementSuperSecretKeyForJWTSigning2024ChangeInProduction
app.jwt.expiration-ms=86400000

# ---------- Logging ----------
logging.level.com.military.assetmanagement=INFO
logging.level.org.springframework.security=WARN
